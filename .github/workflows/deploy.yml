name: Deploy to Railway

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Railway service to deploy'
        required: true
        default: 'parsun-api'
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://parsun-api-production-543c.up.railway.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: sh scripts/railway-deploy.sh
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID || '66b251d2-15eb-446a-a126-b01e64b5fea8' }}
          RAILWAY_SERVICE: ${{ inputs.service }}
