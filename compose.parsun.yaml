name: parsun

services:
  api:
    image: parsun-api:local
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: parsun-api
    restart: "no"
    ports:
      - "127.0.0.1:${PARSUN_API_PORT:-8081}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/parsun?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci
      SPRING_DATASOURCE_USERNAME: parsun
      SPRING_DATASOURCE_PASSWORD: ${PARSUN_DB_PASSWORD:?Set PARSUN_DB_PASSWORD in the workspace .env}
      PARSUN_SEED_ENABLED: ${PARSUN_SEED_ENABLED:-false}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      JWT_SECRET: ${PARSUN_JWT_SECRET:?Set PARSUN_JWT_SECRET in the workspace .env}
      CORS_ALLOWED_ORIGINS: http://localhost:${PARSUN_APP_PORT:-4201},http://127.0.0.1:${PARSUN_APP_PORT:-4201}
      STORAGE_TYPE: s3
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_ACCESS_KEY: parsun
      STORAGE_S3_SECRET_KEY: ${PARSUN_STORAGE_PASSWORD:?Set PARSUN_STORAGE_PASSWORD in the workspace .env}
      STORAGE_S3_BUCKET: parsun-files
      STORAGE_S3_REGION: us-east-1
    volumes:
      - maven_cache:/root/.m2
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    networks:
      parsun:
        aliases:
          - parsun-api-app

  app:
    image: parsun-app:local
    build:
      context: ../Parsun-App
      dockerfile: Dockerfile.local
    container_name: parsun-app
    restart: "no"
    ports:
      - "127.0.0.1:${PARSUN_APP_PORT:-4201}:4200"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4200"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks:
      - parsun

  mysql:
    image: mysql:8.0
    container_name: parsun-mysql
    restart: "no"
    environment:
      MYSQL_DATABASE: parsun
      MYSQL_USER: parsun
      MYSQL_PASSWORD: ${PARSUN_DB_PASSWORD:?Set PARSUN_DB_PASSWORD in the workspace .env}
      MYSQL_ROOT_PASSWORD: ${PARSUN_DB_ROOT_PASSWORD:?Set PARSUN_DB_ROOT_PASSWORD in the workspace .env}
    ports:
      - "127.0.0.1:${PARSUN_DB_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping --silent -h localhost -u root"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - parsun

  minio:
    image: parsun-minio:2025
    build:
      context: .
      dockerfile: Dockerfile.minio
    container_name: parsun-minio
    restart: "no"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: parsun
      MINIO_ROOT_PASSWORD: ${PARSUN_STORAGE_PASSWORD:?Set PARSUN_STORAGE_PASSWORD in the workspace .env}
    ports:
      - "127.0.0.1:${PARSUN_STORAGE_PORT:-9002}:9000"
      - "127.0.0.1:${PARSUN_STORAGE_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - parsun

  minio-init:
    image: parsun-minio:2025
    container_name: parsun-minio-init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing local/parsun-files'
    environment:
      MINIO_ROOT_USER: parsun
      MINIO_ROOT_PASSWORD: ${PARSUN_STORAGE_PASSWORD:?Set PARSUN_STORAGE_PASSWORD in the workspace .env}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - parsun

volumes:
  mysql_data:
  minio_data:
  maven_cache:
    external: true
    name: parsun-maven-cache

networks:
  parsun:
    name: parsun-network
